<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f1f1;
        }

        main {
            background: white;
            max-width: 790px;
            margin: 30px auto;
            padding: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .field {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 8px;
            margin-bottom: 16px;
            align-items: start;
        }

        label {
            text-align: right;
            padding-top: 5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 70px;
            margin-top: 25px;
        }

        button {
            padding: 7px 25px;
        }

        @media (max-width: 720px) {
            .columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h2>ADD CONTACT</h2>
        <form id="contactForm">
            <div class="columns">
                <div>
                    <div class="field"><label for="id">ID:</label><input id="id" type="text"></div>
                    <div class="field"><label for="fullName">Full Name:</label><input id="fullName" type="text"></div>
                    <div class="field"><label for="email">E-mail:</label><input id="email" type="text"></div>
                    <div class="field"><label for="phone">Cell Phone Number:</label><input id="phone" type="text"></div>
                    <div class="field"><label for="instagram">Instagram:</label><input id="instagram" type="text"></div>
                    <div class="field"><label for="facebook">Facebook:</label><input id="facebook" type="text"></div>
                    <div class="field"><label for="known">Known:</label><div><input id="known" type="checkbox"> Yes</div></div>
                </div>
                <div>
                    <div class="field">
                        <label for="contactType">Type:</label>
                        <select id="contactType">
                            <option>Friend</option>
                            <option>Family</option>
                            <option>Job Mate</option>
                            <option>Team Mate</option>
                            <option>High School</option>
                            <option>Gym</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="gender">Gender:</label>
                        <select id="gender"><option>M</option><option>F</option></select>
                    </div>
                    <div class="field">
                        <label for="hobbies">Hobbies:</label>
                        <select id="hobbies" multiple size="8">
                            <option>Play the Guitar</option>
                            <option>Watch movies</option>
                            <option>Play Soccer</option>
                            <option>Play Basketball</option>
                            <option>Cooking</option>
                            <option>Reading</option>
                            <option>Running</option>
                            <option>Swimming</option>
                        </select>
                    </div>
                    <div class="field"><label for="birthDate">Birth Date:</label><input id="birthDate" type="text" placeholder="dd/MM/yyyy"></div>
                    <div class="field"><label for="comments">Comments:</label><textarea id="comments" rows="5"></textarea></div>
                </div>
            </div>
            <div class="buttons">
                <button id="saveButton" type="button">Save</button>
                <button id="cancelButton" type="reset">Cancel</button>
            </div>
        </form>
    </main>
    <script src="../model/Contact.js"></script>
    <script src="FrmContacts.js"></script>
</body>
</html>
