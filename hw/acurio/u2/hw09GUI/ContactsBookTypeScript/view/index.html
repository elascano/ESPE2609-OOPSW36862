<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        main {
            max-width: 800px;
            margin: 35px auto;
            background: white;
            padding: 25px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin: 5px 0 35px;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .field {
            display: grid;
            grid-template-columns: 135px minmax(0, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            align-items: start;
        }

        label {
            text-align: right;
            padding-top: 5px;
            font-size: 14px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            font: 14px Arial;
        }

        textarea {
            resize: vertical;
        }

        @media (max-width: 700px) {
            main {
                margin: 10px;
                padding: 15px;
            }

            .columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main id="app"></main>
    <script src="FrmContacts.js"></script>
</body>
</html>
