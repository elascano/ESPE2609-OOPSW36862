<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ContactBook - TypeScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .menu-bar {
            background-color: #333;
            overflow: hidden;
        }

        .menu-bar a {
            float: left;
            color: white;
            padding: 14px 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .menu-bar a:hover {
            background-color: #ddd;
            color: black;
        }

        .dropdown {
            float: left;
            overflow: hidden;
        }

        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: white;
            padding: 14px 16px;
            background-color: inherit;
            cursor: pointer;
        }

        .dropdown:hover .dropbtn {
            background-color: #ddd;
            color: black;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-save {
            background-color: #4CAF50;
            color: white;
        }

        .btn-cancel {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>

    <div class="menu-bar">
        <div class="dropdown">
            <button class="dropbtn">Archivo</button>
            <div class="dropdown-content">
                <a id="menu-nuevo">Nuevo Contacto</a>
                <a id="menu-salir">Salir</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Ayuda</button>
            <div class="dropdown-content">
                <a id="menu-errores">Errores (0)</a>
                <a id="menu-acerca">Acerca de...</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Agregar Contacto</h2>

        <div class="form-row">
            <div class="form-group">
                <label>ID:</label>
                <input type="number" id="txtId">
            </div>
            <div class="form-group">
                <label>Tipo:</label>
                <select id="cmbType">
                    <option>Friend</option>
                    <option>Family</option>
                    <option>Job Mate</option>
                    <option>Gym Mate</option>
                    <option>Highschool</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="txtFullName">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="txtEmail">
            </div>
            <div class="form-group">
                <label>Género:</label>
                <select id="cmbGender">
                    <option>M</option>
                    <option>F</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Celular:</label>
            <input type="text" id="txtCellphone">
        </div>

        <div class="form-group">
            <label>Instagram:</label>
            <input type="text" id="txtInstagram">
        </div>

        <div class="form-group">
            <label>Facebook:</label>
            <input type="text" id="txtFacebook">
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
            <input type="checkbox" id="chkIsKnown" style="width: auto;">
            <label for="chkIsKnown" style="margin: 0;">Conocido</label>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Fecha Nacimiento:</label>
                <input type="date" id="txtBirthDate">
            </div>
            <div class="form-group">
                <label>Hobbies (Ctrl+clic):</label>
                <select id="lstHobbies" multiple style="height: 60px;">
                    <option>Play the guitar</option>
                    <option>Watch movies</option>
                    <option>Play soccer</option>
                    <option>Play Basketball</option>
                    <option>Reading</option>
                    <option>Cooking</option>
                    <option>Swimming</option>
                    <option>Running</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Comentarios:</label>
            <textarea id="txtComments"></textarea>
        </div>

        <div class="buttons">
            <button class="btn-save" id="btnSave">Save</button>
            <button class="btn-cancel" id="btnCancel">Cancel</button>
        </div>
    </div>

    <!-- Aquí se carga el JavaScript generado por TypeScript -->
    <script type="module" src="dist/main.js"></script>
</body>

</html>
